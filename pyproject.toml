[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dvrp-lab"
version = "0.1.0"
description = "Adaptive Route Repair for Dynamic Last-Mile Delivery — research engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scipy>=1.13",   # Friedman, Wilcoxon
]

[project.optional-dependencies]
selector = [
    "scikit-learn>=1.5",  # shallow decision tree for strategy D only
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "httpx>=0.27",  # FastAPI test client
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "api*"]
